title: myBlog
email: sm@marandi.in
description: >-
  Writing, thoughts, ideas, experiences, etc.
# If deploying as a project site, set your username and repo below
# and keep baseurl. For a user/organization site (username.github.io),
# set baseurl to empty and update url accordingly.
url: "https://sumeetmarandii.github.io"
baseurl: "/myBlog"

# Build settings
markdown: kramdown

# CRITICAL: keep `theme: null`.
# The github-pages gem defaults to "theme: jekyll-theme-primer" whenever no
# `theme:` key is present. That theme ships its own assets/css/style.css, which
# collides with the retro theme in this repo and overwrites it in _site
# depending on write order — the site then flips between retro and Bootstrap
# between builds. An explicit `theme: null` is the documented way to disable it.
theme: null

# Colour mode shown before a visitor picks one: light | dark | system
# "system" follows the operating system's light/dark setting.
default_theme: system

plugins:
  - jekyll-feed
  - jekyll-seo-tag

permalink: /:categories/:year/:month/:day/:title/

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

# Custom site variables
author:
  name: Sumit Marandi
  url: https://sumeetmarandii.github.io
  email: sm@marandi.in
