{%- comment -%}
  Colour-mode toggle: light / dark / system.
  The active state is applied by assets/js/theme.js.
{%- endcomment -%}
<div class="theme-toggle" role="group" aria-label="Colour theme">
  <button type="button" class="theme-toggle-btn" data-theme-set="light" aria-pressed="false" title="Light">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
    </svg>
    <span class="visually-hidden">Light theme</span>
  </button>

  <button type="button" class="theme-toggle-btn" data-theme-set="dark" aria-pressed="false" title="Dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <span class="visually-hidden">Dark theme</span>
  </button>

  <button type="button" class="theme-toggle-btn" data-theme-set="system" aria-pressed="false" title="System">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <rect x="2" y="3" width="20" height="14" rx="2"></rect>
      <line x1="8" y1="21" x2="16" y2="21"></line>
      <line x1="12" y1="17" x2="12" y2="21"></line>
    </svg>
    <span class="visually-hidden">Match system theme</span>
  </button>
</div>
