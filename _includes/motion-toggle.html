{%- comment -%}
  Background-animation toggle. The animated canvas lives in assets/js/live-bg.js;
  this button only switches it on/off and persists the choice.
{%- endcomment -%}
<div class="motion-toggle">
  <button type="button" class="motion-toggle-btn" data-motion-toggle aria-pressed="true" title="Pause background animation">
    <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
      <rect x="6" y="5" width="4" height="14" rx="1"></rect>
      <rect x="14" y="5" width="4" height="14" rx="1"></rect>
    </svg>
    <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
      <path d="M8 5.14v13.72c0 .8.87 1.3 1.56.89l10.5-6.86a1.05 1.05 0 0 0 0-1.78L9.56 4.25A1.05 1.05 0 0 0 8 5.14z"></path>
    </svg>
    <span class="visually-hidden">Background animation</span>
  </button>
</div>
